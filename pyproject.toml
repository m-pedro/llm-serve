[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-serve"
version = "0.1.0"
description = "vLLM-style High-Throughput LLM Inference Engine from scratch in PyTorch: PagedAttention, Copy-on-Write, Prefix Caching, Continuous Batching, and Speculative Decoding"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.1.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
